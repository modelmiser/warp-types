[package]
name = "ptxprobe"
version = "0.0.0"
edition = "2021"
publish = false
description = "Device-side probe: emits PTX for a few typed operations so scripts/check-ptx-operands.sh can grep their operands"

[lib]
crate-type = ["rlib"]

[features]
# Instantiates Warp<Empty>::shuffle_xor_within from an .entry: the device build must FAIL (E0080).
empty-probe = []
# A #[warp_kernel] with `type S = [i32]; p: *mut S`: the device build must FAIL (fat pointer).
alias-probe = []

[dependencies]
warp-types = { path = "../.." }
warp-types-kernel = { path = "../../warp-types-kernel" }

[profile.release]
opt-level = 3

[workspace]
