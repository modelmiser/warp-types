[package]
name = "warp-types-sat"
version = "0.3.0"
edition = "2021"
authors = ["Chad Aldreda"]
description = "Phase-typed CDCL SAT solver with compile-time phase ordering, built on warp-types"
license = "MIT"
rust-version = "1.75"
repository = "https://github.com/modelmiser/warp-types"
readme = "README.md"
keywords = ["sat", "cdcl", "solver", "typestate", "warp"]
categories = ["algorithms", "science"]

[[bin]]
name = "solve"
path = "src/bin/solve.rs"

[features]
default = []
gpu = ["dep:cudarc", "dep:warp-types-builder"]

[dependencies]
warp-types = { path = "..", version = "0.3.2" }
cudarc = { version = "0.19", features = ["driver", "cuda-12000"], optional = true }

[build-dependencies]
warp-types-builder = { path = "../warp-types-builder", version = "0.3.1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

# Peer-solver comparison (`batsat`, `splr`) is a Tier-2 follow-up:
# verify current crate versions + public APIs against their docs on
# docs.rs before adding. Scaffolding in benches/random_3sat.rs marks
# the integration points; intentionally not wired here.

[[bench]]
name = "random_3sat"
harness = false

[[bench]]
name = "cardinality"
harness = false
