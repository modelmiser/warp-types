name: Rust CI

on:
  push:
    branches: [main]
    paths-ignore: ['lean/**', '*.md', 'paper/**', 'blog/**']
  pull_request:
    branches: [main]
    paths-ignore: ['lean/**', '*.md', 'paper/**', 'blog/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01
          components: rustfmt
          # Host target only. The device side is covered by the `nvptx` job;
          # the `gpu` FEATURE (CUDA runtime, real hardware) is still local-only.
      - name: Format check
        run: cargo fmt --check
      - name: Build
        run: cargo build --workspace --verbose
      - name: Tests (unit + integration)
        run: cargo test --workspace --tests --verbose
      - name: Tests (warp64 feature)
        # warp64 swaps the lane count to 64 (AMD wavefronts). Its cfg branches
        # in active_set/shuffle/sort/cub/gradual are dead code in every other
        # step, and two tests exist only under it.
        run: cargo test -p warp-types --tests --features warp64 --verbose
      - name: Doc tests
        run: cargo test --workspace --doc --verbose
      - name: Example tests
        run: cargo test --workspace --examples --verbose
      # The fuzz crate is detached from the workspace, so nothing above compiles
      # it and its targets can silently stop building against a changed API —
      # which is the way fuzzing actually rots, long before anyone notices they
      # have stopped running it. A plain `cargo check` catches that in seconds
      # and needs no cargo-fuzz install (a multi-minute cold-runner build, which
      # is why the fuzzing itself stays manual — see tools/fuzz.sh).
      - name: Fuzz targets still compile
        run: cargo check --manifest-path warp-types-sat/fuzz/Cargo.toml

  miri:
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml. The pin exists for reproducible GPU
      # artifact evaluation; the `miri` component is not published for every
      # nightly date, so pinning it here would break the job on a date the
      # component happens to be missing. Miri does not touch the nvptx path,
      # so the pin buys nothing on this job.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      # Covers the host-side unsafe only: warp-types-sat's pointer-based BCP
      # loop and unchecked arena/trail accessors, plus the root crate's
      # research::coalescing raw-pointer derefs. src/gpu.rs is entirely
      # `#[cfg(target_arch = "nvptx64")]` and reproduce/ is outside the
      # workspace, so Miri cannot reach either — see tools/miri.sh for the
      # full scope note and why two tests are skipped.
      - name: Miri (Stacked Borrows + Tree Borrows)
        run: tools/miri.sh

  nvptx:
    runs-on: ubuntu-latest
    # Type-checks the DEVICE side, which every other job structurally cannot see.
    # `src/gpu.rs` is entirely `#[cfg(target_arch = "nvptx64")]`, so a host build
    # removes the items outright: no build, no clippy, no test, and Miri cannot
    # reach them either. That was 33 unsafe constructs verified only by local
    # sm_89 runs. Compiling for the device target needs no GPU — just the target's
    # core, which rust-toolchain.toml already requests.
    #
    # Adding this found four real defects on the first run: a `pub unsafe fn`
    # taking a raw pointer with no `# Safety` section, a dead `abi_ptx` feature
    # gate, a vestigial bounds parameter, and `missing_safety_doc` firing on every
    # macro-generated kernel in every downstream crate.
    #
    # Lib-only, NOT `--all-targets`: the device target is `no_std` and has no
    # `test` crate, so building test targets fails with 165 errors about `std`.
    # The three crates are checked separately because `sat-kernels` and the worked
    # example each declare their own `[workspace]`, so nothing above compiles them.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01
          targets: nvptx64-nvidia-cuda
          components: clippy
      - name: Clippy (device target — root lib)
        run: cargo clippy -p warp-types --target nvptx64-nvidia-cuda -- -D warnings
      - name: Clippy (device target — sat-kernels)
        run: cargo clippy --manifest-path warp-types-sat/sat-kernels/Cargo.toml --target nvptx64-nvidia-cuda -- -D warnings
      - name: Clippy (device target — worked example)
        run: cargo clippy --manifest-path examples/gpu-project/my-kernels/Cargo.toml --target nvptx64-nvidia-cuda -- -D warnings
      # reproduce/*.rs are standalone no_std files with no manifest at all —
      # nothing in the workspace compiles them, so their 16 unsafe constructs have
      # never been built by CI. They are the paper's bug-repro artifacts, so a
      # compile check is the right scope: NOT -D warnings, because dead_code is
      # expected in demo files carrying unused helpers.
      #
      # buggy_pattern.rs is deliberately excluded: it INTENTIONALLY does not
      # compile (that is the demonstration), and reproduce/demo.sh already asserts
      # it fails with the specific E0599.
      #
      # Output goes to a temp dir on purpose. The committed .ptx files are
      # historical artifacts — two are still ISA 6.0 from an unrecorded toolchain
      # while this pin emits 7.0, and reproduce/host loads them on real hardware.
      # Overwriting them here would silently break the link between the committed
      # PTX and the H200 results the paper cites. See TODO.
      - name: Compile the repro kernels (device target)
        run: |
          out=$(mktemp -d)
          for f in rust_ptx_typed typed_butterfly_kernel reduce7_typed; do
            echo "--- $f"
            rustc --target nvptx64-nvidia-cuda --emit=asm -O --edition 2021 \
              "reproduce/$f.rs" -o "$out/$f.ptx"
          done

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01
          components: clippy, rustfmt
          # Host target only — see the `nvptx` job for the device side.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (warp64 feature)
        run: cargo clippy -p warp-types --all-targets --features warp64 -- -D warnings

  toolchain-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check toolchain pin is less than 90 days old
        run: |
          PIN=$(grep '^channel' rust-toolchain.toml | grep -oP '\d{4}-\d{2}-\d{2}' || true)
          if [ -z "$PIN" ]; then
            echo "::warning::No date found in rust-toolchain.toml channel pin — cannot check freshness."
            exit 0
          fi
          PIN_EPOCH=$(date -d "$PIN" +%s)
          NOW_EPOCH=$(date +%s)
          AGE_DAYS=$(( (NOW_EPOCH - PIN_EPOCH) / 86400 ))
          echo "Pinned nightly: $PIN ($AGE_DAYS days old)"
          if [ "$AGE_DAYS" -gt 90 ]; then
            echo "::error::Toolchain pin '$PIN' is $AGE_DAYS days old (>90). Update rust-toolchain.toml and ci.yml."
            exit 1
          fi
