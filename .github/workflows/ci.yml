name: Rust CI

on:
  push:
    branches: [main]
    paths-ignore: ['lean/**', '*.md', 'paper/**', 'blog/**']
  pull_request:
    branches: [main]
    paths-ignore: ['lean/**', '*.md', 'paper/**', 'blog/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01
          components: rustfmt
          # nvptx64 target omitted — gpu feature needs CUDA, tested locally
      - name: Format check
        run: cargo fmt --check
      - name: Build
        run: cargo build --workspace --verbose
      - name: Tests (unit + integration)
        run: cargo test --workspace --tests --verbose
      - name: Tests (warp64 feature)
        # warp64 swaps the lane count to 64 (AMD wavefronts). Its cfg branches
        # in active_set/shuffle/sort/cub/gradual are dead code in every other
        # step, and two tests exist only under it.
        run: cargo test -p warp-types --tests --features warp64 --verbose
      - name: Doc tests
        run: cargo test --workspace --doc --verbose
      - name: Example tests
        run: cargo test --workspace --examples --verbose

  miri:
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml. The pin exists for reproducible GPU
      # artifact evaluation; the `miri` component is not published for every
      # nightly date, so pinning it here would break the job on a date the
      # component happens to be missing. Miri does not touch the nvptx path,
      # so the pin buys nothing on this job.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      # Covers the host-side unsafe only: warp-types-sat's pointer-based BCP
      # loop and unchecked arena/trail accessors, plus the root crate's
      # research::coalescing raw-pointer derefs. src/gpu.rs is entirely
      # `#[cfg(target_arch = "nvptx64")]` and reproduce/ is outside the
      # workspace, so Miri cannot reach either — see tools/miri.sh for the
      # full scope note and why two tests are skipped.
      - name: Miri (Stacked Borrows + Tree Borrows)
        run: tools/miri.sh

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01
          components: clippy, rustfmt
          # nvptx64 target omitted — gpu feature needs CUDA, tested locally
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (warp64 feature)
        run: cargo clippy -p warp-types --all-targets --features warp64 -- -D warnings

  toolchain-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check toolchain pin is less than 90 days old
        run: |
          PIN=$(grep '^channel' rust-toolchain.toml | grep -oP '\d{4}-\d{2}-\d{2}' || true)
          if [ -z "$PIN" ]; then
            echo "::warning::No date found in rust-toolchain.toml channel pin — cannot check freshness."
            exit 0
          fi
          PIN_EPOCH=$(date -d "$PIN" +%s)
          NOW_EPOCH=$(date +%s)
          AGE_DAYS=$(( (NOW_EPOCH - PIN_EPOCH) / 86400 ))
          echo "Pinned nightly: $PIN ($AGE_DAYS days old)"
          if [ "$AGE_DAYS" -gt 90 ]; then
            echo "::error::Toolchain pin '$PIN' is $AGE_DAYS days old (>90). Update rust-toolchain.toml and ci.yml."
            exit 1
          fi
