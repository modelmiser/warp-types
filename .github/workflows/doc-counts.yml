name: Doc Counts

# Runs the repo's doc-integrity guards in CI: the doc-count freshness guard
# (scripts/check-doc-counts.sh) and the paper-sync guard
# (scripts/check-paper-sync.sh).
#
# Deliberately has NO paths-ignore: unlike ci.yml (which skips *.md / paper /
# blog), this guard's entire purpose is to compare doc claims against the real
# test/theorem counts, so it MUST run when docs change too — including doc-only
# PRs from external contributors who do not have the local pre-push hook.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  doc-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Before the toolchain install: this guard is pure python3 and needs no
      # cargo, so a paper fork reports in seconds rather than after a build.
      # It was written at the 2026-08-13 gate — which found the assembled,
      # DOI'd paper carrying contradictory verdicts and placeholder references
      # against its section files — but was never wired to anything, so it had
      # never run outside a manual invocation.
      - name: Paper sync guard (section files == paper.md spans)
        run: bash scripts/check-paper-sync.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01
          # Same pin as ci.yml. The guard compiles the workspace to count
          # unit/doc/example tests; no rustfmt/clippy components needed.
      - name: Doc-count freshness guard
        run: bash scripts/check-doc-counts.sh
